<body>

<h1>ECM Factorisatie – Montgomery X/Z</h1>

<p>
    Factoriseer N =
    <input
        type="text"
        id="N"
        value="11111111111"
        autocomplete="off"
        style="width:12ch;"
    />
    <span id="digitCount">(11 digits)</span>
</p>

<button id="startBtn">Start factorisatie</button>
<button id="stopBtn" disabled>Stop</button>
<button id="clearBtn">Wis invoer</button>

<div id="log"></div>


<script>

// ============================================================
// BASISFUNCTIES
// ============================================================

function gcd(a, b) {

    if (a < 0n) a = -a;
    if (b < 0n) b = -b;

    while (b !== 0n) {
        const t = a % b;
        a = b;
        b = t;
    }

    return a;
}


function mod(a, n) {

    a %= n;

    return a < 0n ? a + n : a;
}


// ============================================================
// MODULAIRE INVERSE
// ============================================================

function modInverse(a, n) {

    a = mod(a, n);

    let oldR = a;
    let r = n;

    let oldS = 1n;
    let s = 0n;

    while (r !== 0n) {

        const q = oldR / r;

        [oldR, r] =
            [r, oldR - q * r];

        [oldS, s] =
            [s, oldS - q * s];
    }

    return [
        oldR,
        mod(oldS, n)
    ];
}


// ============================================================
// MODULAIRE MACHT
// ============================================================

function modPow(base, exp, n) {

    base = mod(base, n);

    let result = 1n;

    while (exp > 0n) {

        if (exp & 1n) {
            result =
                (result * base) % n;
        }

        base =
            (base * base) % n;

        exp >>= 1n;
    }

    return result;
}


// ============================================================
// RANDOM BIGINT
// ============================================================

function randomBigIntBelow(max) {

    if (max <= 1n) {
        return 0n;
    }

    const bits =
        max.toString(2).length;

    const words =
        Math.ceil(bits / 32);

    const buffer =
        new Uint32Array(words);

    while (true) {

        crypto.getRandomValues(buffer);

        let value = 0n;

        for (let i = 0; i < words; i++) {

            value =
                (value << 32n) |
                BigInt(buffer[i]);
        }

        const extraBits =
            words * 32 - bits;

        if (extraBits > 0) {

            value &=
                (1n << BigInt(bits)) - 1n;
        }

        if (
            value > 0n &&
            value < max
        ) {
            return value;
        }
    }
}


// ============================================================
// PRIEMGETALLEN
// ============================================================

function generatePrimes(limit) {

    const sieve =
        new Uint8Array(limit + 1);

    sieve.fill(1);

    sieve[0] = 0;
    sieve[1] = 0;

    for (
        let p = 2;
        p * p <= limit;
        p++
    ) {

        if (sieve[p]) {

            for (
                let j = p * p;
                j <= limit;
                j += p
            ) {
                sieve[j] = 0;
            }
        }
    }

    const primes = [];

    for (
        let p = 2;
        p <= limit;
        p++
    ) {

        if (sieve[p]) {
            primes.push(BigInt(p));
        }
    }

    return primes;
}


// ============================================================
// ECM-SCALAR K
//
// K = product(p^e), waarbij p^e <= B1
// ============================================================

function computeECMScalar(primes, B1) {

    let K = 1n;

    const B =
        BigInt(B1);

    for (const p of primes) {

        let q = p;

        while (q * p <= B) {
            q *= p;
        }

        K *= q;
    }

    return K;
}


// ============================================================
// MONTGOMERY PUNTDUBBELING
//
// Curve:
//
//     y² = x³ + A x² + x
//
// A24 = (A + 2) / 4
//
// Punt:
//
//     P = (X : Z)
//
// x = X/Z
// ============================================================

function montgomeryDouble(P, A24, N) {

    const X = P[0];
    const Z = P[1];

    const A =
        mod(X + Z, N);

    const AA =
        (A * A) % N;

    const B =
        mod(X - Z, N);

    const BB =
        (B * B) % N;

    const C =
        mod(AA - BB, N);

    const X2 =
        (AA * BB) % N;

    const Z2 =
        (
            C *
            mod(
                BB + A24 * C,
                N
            )
        ) % N;

    return [X2, Z2];
}


// ============================================================
// DIFFERENTIËLE MONTGOMERY OPTELLING
//
// P + Q, waarbij P-Q bekend is.
// ============================================================

function montgomeryAdd(P, Q, D, N) {

    const X1 = P[0];
    const Z1 = P[1];

    const X2 = Q[0];
    const Z2 = Q[1];

    const Xd = D[0];
    const Zd = D[1];

    const A =
        mod(X1 + Z1, N);

    const B =
        mod(X1 - Z1, N);

    const C =
        mod(X2 + Z2, N);

    const Dd =
        mod(X2 - Z2, N);

    const DA =
        (Dd * A) % N;

    const CB =
        (C * B) % N;

    const S1 =
        mod(DA + CB, N);

    const S2 =
        mod(DA - CB, N);

    const X3 =
        (Zd * S1 * S1) % N;

    const Z3 =
        (Xd * S2 * S2) % N;

    return [X3, Z3];
}


// ============================================================
// MONTGOMERY LADDER
// ============================================================

function montgomeryLadder(k, P, A24, N) {

    if (k === 0n) {
        return [0n, 0n];
    }

    const bits =
        k.toString(2);

    let R0 = P;

    let R1 =
        montgomeryDouble(
            P,
            A24,
            N
        );

    for (
        let i = 1;
        i < bits.length;
        i++
    ) {

        if (bits[i] === "0") {

            R1 =
                montgomeryAdd(
                    R0,
                    R1,
                    P,
                    N
                );

            R0 =
                montgomeryDouble(
                    R0,
                    A24,
                    N
                );

        } else {

            R0 =
                montgomeryAdd(
                    R0,
                    R1,
                    P,
                    N
                );

            R1 =
                montgomeryDouble(
                    R1,
                    A24,
                    N
                );
        }
    }

    return R0;
}


// ============================================================
// SUYAMA CURVE
//
// We gebruiken de standaard Suyama-parameterisatie.
// ============================================================

function createECMCurve(N) {

    while (true) {

        const sigma =
            randomBigIntBelow(
                N - 6n
            ) + 6n;

        const u =
            mod(
                sigma * sigma - 5n,
                N
            );

        const v =
            mod(
                4n * sigma,
                N
            );

        if (
            u === 0n ||
            v === 0n
        ) {
            continue;
        }

        const u2 =
            (u * u) % N;

        const u3 =
            (u2 * u) % N;

        const vu =
            mod(v - u, N);

        const vu2 =
            (vu * vu) % N;

        const vu3 =
            (vu2 * vu) % N;

        const threeUPlusV =
            mod(
                3n * u + v,
                N
            );

        const numerator =
            (
                vu3 *
                threeUPlusV
            ) % N;

        const denominator =
            (
                (
                    16n *
                    u3
                ) % N *
                v
            ) % N;

        const g =
            gcd(
                denominator,
                N
            );

        if (
            g !== 1n &&
            g !== N
        ) {

            return {
                factor: g
            };
        }

        const [gg, inverse] =
            modInverse(
                denominator,
                N
            );

        if (gg !== 1n) {
            continue;
        }

        const A24 =
            (
                numerator *
                inverse
            ) % N;

        return {
            P: [u3, (v * v * v) % N],
            A24: A24
        };
    }
}


// ============================================================
// MILLER-RABIN PRIEMTEST
// ============================================================

function isProbablePrime(
    N,
    rounds = 10
) {

    if (N < 2n) {
        return false;
    }

    const smallPrimes = [
        2n, 3n, 5n, 7n,
        11n, 13n, 17n,
        19n, 23n, 29n,
        31n, 37n
    ];

    for (const p of smallPrimes) {

        if (N === p) {
            return true;
        }

        if (N % p === 0n) {
            return false;
        }
    }

    let d = N - 1n;
    let s = 0;

    while (
        (d & 1n) === 0n
    ) {

        d >>= 1n;
        s++;
    }

    WitnessLoop:
    for (
        let i = 0;
        i < rounds;
        i++
    ) {

        const a =
            randomBigIntBelow(
                N - 3n
            ) + 2n;

        let x =
            modPow(
                a,
                d,
                N
            );

        if (
            x === 1n ||
            x === N - 1n
        ) {
            continue;
        }

        for (
            let r = 1;
            r < s;
            r++
        ) {

            x =
                (x * x) % N;

            if (
                x === N - 1n
            ) {
                continue WitnessLoop;
            }
        }

        return false;
    }

    return true;
}


// ============================================================
// FACTORLABEL
//
// P8 = priem
// C8 = samengesteld
// ============================================================

function factorLabel(n) {

    const digits =
        n.toString().length;

    const prime =
        isProbablePrime(n);

    return {
        prime: prime,
        text:
            `${prime ? "P" : "C"}${digits} = ${n}`
    };
}


// ============================================================
// KLEINE FACTOREN
// ============================================================

const smallPrimes = [
    2n, 3n, 5n, 7n,
    11n, 13n, 17n,
    19n, 23n, 29n,
    31n, 37n,
    41n, 43n,
    47n, 53n,
    59n, 61n,
    67n, 71n,
    73n, 79n,
    83n, 89n,
    97n
];


// ============================================================
// STAGE 1
// ============================================================

function runStage1(
    N,
    K,
    curve
) {

    const R =
        montgomeryLadder(
            K,
            curve.P,
            curve.A24,
            N
        );

    const g =
        gcd(
            R[1],
            N
        );

    if (
        g !== 1n &&
        g !== N
    ) {
        return g;
    }

    return {
        point: R
    };
}


// ============================================================
// STAGE 2
//
// Bewust beperkt gehouden:
//
//     B1 < p <= B2
//
// waarbij B2 maximaal 10 * B1 is.
//
// Dit voorkomt enorme geheugengebruik.
//
// Het is geen volledig geoptimaliseerde
// Brent-Suyama Stage 2.
// ============================================================

function runStage2(
    N,
    Q,
    A24,
    stage2Primes,
    onStop
) {

    let product = 1n;

    const blockSize = 16;

    let count = 0;

    for (
        let i = 0;
        i < stage2Primes.length;
        i++
    ) {

        if (onStop()) {
            return null;
        }

        const q =
            stage2Primes[i];

        const R =
            montgomeryLadder(
                q,
                Q,
                A24,
                N
            );

        product =
            (
                product *
                R[1]
            ) % N;

        count++;

        if (
            count >= blockSize ||
            i === stage2Primes.length - 1
        ) {

            const g =
                gcd(
                    product,
                    N
                );

            if (
                g !== 1n &&
                g !== N
            ) {
                return g;
            }

            product = 1n;
            count = 0;
        }
    }

    return null;
}


// ============================================================
// ÉÉN ECM-CURVE
// ============================================================

function runECMCurve(
    N,
    K,
    stage2Primes,
    onStop
) {

    const curve =
        createECMCurve(N);

    if (curve.factor) {
        return curve.factor;
    }

    // -------------------------
    // Stage 1
    // -------------------------

    const stage1 =
        runStage1(
            N,
            K,
            curve
        );

    if (typeof stage1 === "bigint") {
        return stage1;
    }

    const Q =
        stage1.point;

    // Controle na overgang
    let g =
        gcd(
            Q[1],
            N
        );

    if (
        g !== 1n &&
        g !== N
    ) {
        return g;
    }

    // -------------------------
    // Stage 2
    // -------------------------

    if (
        stage2Primes.length > 0
    ) {

        const factor =
            runStage2(
                N,
                Q,
                curve.A24,
                stage2Primes,
                onStop
            );

        if (factor) {
            return factor;
        }
    }

    return null;
}


// ============================================================
// ECM-FASE
// ============================================================

async function ecmPhase(
    N,
    B1,
    B2,
    curves,
    log,
    onStop
) {

    log("");
    log("🔄 ECM-fase");
    log(
        `   B1 = ${B1.toLocaleString()}`
    );
    log(
        `   B2 = ${B2.toLocaleString()}`
    );

    const primes =
        generatePrimes(B1);

    const allPrimes =
        generatePrimes(B2);

    const stage2Primes =
        allPrimes.filter(
            p =>
                p > BigInt(B1)
        );

    log(
        `   Stage 1: ` +
        `${primes.length.toLocaleString()} priemgetallen`
    );

    log(
        `   Stage 2: ` +
        `${stage2Primes.length.toLocaleString()} priemgetallen`
    );

    const K =
        computeECMScalar(
            primes,
            B1
        );

    log(
        `   K = ` +
        `${K.toString(2).length} bits`
    );

    for (
        let curveNo = 1;
        curveNo <= curves;
        curveNo++
    ) {

        if (onStop()) {
            return null;
        }

        const start =
            performance.now();

        const factor =
            runECMCurve(
                N,
                K,
                stage2Primes,
                onStop
            );

        const elapsed =
            performance.now() -
            start;

        if (factor) {

            return {
                factor: factor,
                curve: curveNo,
                elapsed: elapsed
            };
        }

        if (
            curveNo === 1 ||
            curveNo % 5 === 0
        ) {

            log(
                `   Curve ${curveNo}` +
                `   ${elapsed.toFixed(0)} ms`
            );

            await new Promise(
                resolve =>
                    setTimeout(resolve, 0)
            );
        }
    }

    return null;
}


// ============================================================
// ADAPTIVE ECM
//
// B2 blijft bewust beperkt.
// ============================================================

async function adaptiveECM(
    N,
    log,
    onStop
) {

    const settings = [

        {
            B1: 10000,
            B2: 100000,
            curves: 30
        },

        {
            B1: 25000,
            B2: 250000,
            curves: 30
        },

        {
            B1: 50000,
            B2: 500000,
            curves: 40
        },

        {
            B1: 100000,
            B2: 1000000,
            curves: 40
        },

        {
            B1: 250000,
            B2: 2500000,
            curves: 50
        },

        {
            B1: 500000,
            B2: 5000000,
            curves: 60
        },

        {
            B1: 1000000,
            B2: 10000000,
            curves: 70
        },

        {
            B1: 3000000,
            B2: 30000000,
            curves: 80
        }
    ];

    for (
        const setting of settings
    ) {

        if (onStop()) {
            return null;
        }

        const result =
            await ecmPhase(
                N,
                setting.B1,
                setting.B2,
                setting.curves,
                log,
                onStop
            );

        if (result) {
            return result;
        }
    }

    return null;
}


// ============================================================
// RECURSIEVE FACTORISATIE
// ============================================================

async function factorRecursive(
    N,
    factors,
    log,
    onStop,
    depth = 0
) {

    if (onStop()) {
        return false;
    }

    if (N === 1n) {
        return true;
    }

    const indent =
        "  ".repeat(depth);

    // --------------------------------------------------------
    // Eerst kleine factoren eruit halen
    // --------------------------------------------------------

    for (
        const p of smallPrimes
    ) {

        if (
            N === p
        ) {

            factors.push(p);

            return true;
        }

        while (
            N % p === 0n
        ) {

            factors.push(p);

            N /= p;

            log(
                `${indent}Kleine factor: ${p}`
            );
        }

        if (N === 1n) {
            return true;
        }
    }

    // --------------------------------------------------------
    // Is wat overblijft priem?
    // --------------------------------------------------------

    if (
        isProbablePrime(N)
    ) {

        factors.push(N);

        return true;
    }

    // --------------------------------------------------------
    // ECM
    // --------------------------------------------------------

    log("");
    log(
        `${indent}🔎 ECM op ${N}`
    );

    const result =
        await adaptiveECM(
            N,
            message =>
                log(
                    indent + message
                ),
            onStop
        );

    if (!result) {
        return false;
    }

    const factor =
        result.factor;

    // Veiligheidscontrole
    if (
        factor <= 1n ||
        factor >= N ||
        N % factor !== 0n
    ) {

        log(
            `${indent}❌ Ongeldige factor ontvangen.`
        );

        return false;
    }

    const cofactor =
        N / factor;

    const factorInfo =
        factorLabel(factor);

    const cofactorInfo =
        factorLabel(cofactor);

    log("");
    log(
        `${indent}✅ Factor gevonden:`
    );

    log(
        `${indent}   ${factorInfo.text}`
    );

    log(
        `${indent}   Cofactor: ${cofactorInfo.text}`
    );

    log(
        `${indent}   Curve: ${result.curve}`
    );

    log(
        `${indent}   Tijd: ` +
        `${result.elapsed.toFixed(0)} ms`
    );

    // --------------------------------------------------------
    // Factor verder ontbinden
    // --------------------------------------------------------

    const ok1 =
        await factorRecursive(
            factor,
            factors,
            log,
            onStop,
            depth + 1
        );

    if (!ok1) {
        return false;
    }

    const ok2 =
        await factorRecursive(
            cofactor,
            factors,
            log,
            onStop,
            depth + 1
        );

    return ok2;
}


// ============================================================
// FACTOREN SORTEREN
// ============================================================

function sortFactors(factors) {

    factors.sort(
        (a, b) =>
            a < b ? -1 :
            a > b ? 1 : 0
    );
}


// ============================================================
// UI
// ============================================================

const logEl =
    document.getElementById(
        "log"
    );

const startBtn =
    document.getElementById(
        "startBtn"
    );

const stopBtn =
    document.getElementById(
        "stopBtn"
    );

const clearBtn =
    document.getElementById(
        "clearBtn"
    );

const Ninput =
    document.getElementById(
        "N"
    );

const digitCount =
    document.getElementById(
        "digitCount"
    );

let stopFlag = false;


// ============================================================
// LOG
// ============================================================

function logMsg(message) {

    logEl.textContent +=
        message + "\n";

    logEl.scrollTop =
        logEl.scrollHeight;
}


// ============================================================
// INPUT
// ============================================================

function updateInputWidthAndDigits() {

    const value =
        Ninput.value.trim();

    const digits =
        value.replace(
            /\D/g,
            ""
        ).length;

    Ninput.style.width =
        Math.max(
            digits,
            10
        ) + "ch";

    digitCount.textContent =
        `(${digits} digits)`;
}

updateInputWidthAndDigits();

Ninput.addEventListener(
    "input",
    updateInputWidthAndDigits
);


// ============================================================
// START
// ============================================================

startBtn.onclick = async () => {

    logEl.textContent = "";

    stopFlag = false;

    const Nstr =
        Ninput.value.trim();

    if (
        !/^\d+$/.test(Nstr)
    ) {

        alert(
            "Voer een geldig natuurlijk getal in."
        );

        return;
    }

    const N =
        BigInt(Nstr);

    if (N < 2n) {

        alert(
            "Getal moet groter zijn dan 1."
        );

        return;
    }

    startBtn.disabled = true;
    stopBtn.disabled = false;
    clearBtn.disabled = true;

    const totalStart =
        performance.now();

    // --------------------------------------------------------
    // PRIEMTEST
    // --------------------------------------------------------

    logMsg(
        `🔍 Priemtest op N=${N}...`
    );

    const primeStart =
        performance.now();

    if (
        isProbablePrime(N)
    ) {

        const ms =
            Math.round(
                performance.now() -
                primeStart
            );

        logMsg("");

        logMsg(
            `✅ P${N.toString().length} = ${N}`
        );

        logMsg(
            `   Getal is waarschijnlijk priem.`
        );

        logMsg(
            `   Priemtest: ${ms} ms`
        );

        startBtn.disabled = false;
        stopBtn.disabled = true;
        clearBtn.disabled = false;

        return;
    }

    logMsg(
        `ℹ️ N is samengesteld.`
    );

    logMsg(
        `\n🚀 Montgomery ECM gestart...`
    );

    const factors = [];

    let success = false;

    try {

        success =
            await factorRecursive(
                N,
                factors,
                logMsg,
                () => stopFlag
            );

    } catch (error) {

        logMsg(
            `\n❌ Fout: ${error.message}`
        );

        console.error(error);
    }

    // --------------------------------------------------------
    // EINDRESULTAAT
    // --------------------------------------------------------

    const totalTime =
        performance.now() -
        totalStart;

    if (
        success &&
        !stopFlag
    ) {

        sortFactors(factors);

        logMsg("");
        logMsg(
            "========================================"
        );

        logMsg(
            "VOLLEDIGE FACTORISATIE"
        );

        logMsg(
            "========================================"
        );

        for (
            const factor of factors
        ) {

            const info =
                factorLabel(factor);

            logMsg(
                `  ${info.text}`
            );
        }

        // ----------------------------------------------------
        // PRODUCTCONTROLE
        // ----------------------------------------------------

        let product = 1n;

        for (
            const factor of factors
        ) {
            product *= factor;
        }

        logMsg("");
        logMsg(
            "Controle:"
        );

        logMsg(
            `  Product = ${product}`
        );

        logMsg(
            `  N       = ${N}`
        );

        if (
            product === N
        ) {

            logMsg(
                "  ✅ Product = N"
            );

        } else {

            logMsg(
                "  ❌ FOUT: product ≠ N"
            );
        }

        logMsg("");

        logMsg(
            `Totale tijd: ` +
            `${(totalTime / 1000).toFixed(2)} s`
        );

    } else if (
        stopFlag
    ) {

        logMsg(
            "\n⏹️ Factorisatie gestopt."
        );

    } else {

        logMsg(
            "\n❌ Geen volledige factorisatie gevonden."
        );

        logMsg(
            `Totale tijd: ` +
            `${(totalTime / 1000).toFixed(2)} s`
        );
    }

    startBtn.disabled = false;
    stopBtn.disabled = true;
    clearBtn.disabled = false;
};


// ============================================================
// STOP
// ============================================================

stopBtn.onclick = () => {

    stopFlag = true;

    logMsg(
        "\n⏹️ Stop gevraagd..."
    );

    stopBtn.disabled = true;
};


// ============================================================
// WISSEN
// ============================================================

clearBtn.onclick = () => {

    Ninput.value = "";

    updateInputWidthAndDigits();

    logEl.textContent = "";
};

</script>

</body>
</html>
