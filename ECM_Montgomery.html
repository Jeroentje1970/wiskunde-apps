<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">

<title>ECM Factorisatie – Montgomery X/Z</title>

<style>

    body {
        font-family: monospace;
        background: #222;
        color: #ddd;
        padding: 20px;
    }

    h1 {
        color: #fff;
    }

    input {
        font-family: monospace;
        font-size: 16px;
    }

    button {
        font-family: monospace;
        font-size: 14px;
        margin: 4px;
    }

    #log {
        white-space: pre-wrap;
        background: #111;
        padding: 10px;
        margin-top: 15px;
        border: 1px solid #555;
        max-height: 700px;
        overflow-y: auto;
    }

    .step-button {
        margin: 0 2px;
        padding: 0;
        width: 28px;
        height: 22px;
        font-size: 13px;
        line-height: 18px;
        vertical-align: middle;
        cursor: pointer;
    }

</style>
</head>

<body>

<h1>ECM Factorisatie – Montgomery X/Z</h1>

<p>
    Factoriseer N =
    <input
        type="text"
        id="N"
        value="11111111111"
        autocomplete="off"
        style="width:12ch;"
    />

    <button
        id="upBtn"
        class="step-button"
        type="button"
        title="Verhoog N met 1"
    >▲</button>

    <button
        id="downBtn"
        class="step-button"
        type="button"
        title="Verlaag N met 1"
    >▼</button>

    <span id="digitCount">(11 digits)</span>
</p>

<p>
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
    <button id="clearBtn">Clear</button>
</p>

<div id="log"></div>

<script>

// ============================================================
// ELEMENTEN
// ============================================================

const Ninput =
    document.getElementById(
        "N"
    );

const digitCount =
    document.getElementById(
        "digitCount"
    );

const startBtn =
    document.getElementById(
        "startBtn"
    );

const stopBtn =
    document.getElementById(
        "stopBtn"
    );

const clearBtn =
    document.getElementById(
        "clearBtn"
    );

const log =
    document.getElementById(
        "log"
    );


// ============================================================
// UP / DOWN KNOPPEN
// ============================================================

const upBtn =
    document.getElementById(
        "upBtn"
    );

const downBtn =
    document.getElementById(
        "downBtn"
    );


function changeInputValue(amount) {

    const value =
        Ninput.value.trim();

    if (
        !/^\d+$/.test(value)
    ) {

        return;
    }

    let N =
        BigInt(value);

    N += amount;

    if (N < 0n) {

        N = 0n;
    }

    Ninput.value =
        N.toString();

    updateInputWidthAndDigits();

    Ninput.focus();
}


upBtn.onclick = () => {

    changeInputValue(1n);
};


downBtn.onclick = () => {

    changeInputValue(-1n);
};


// ============================================================
// LOG
// ============================================================

function logMsg(text = "") {

    log.textContent +=
        text + "\n";

    log.scrollTop =
        log.scrollHeight;
}


// ============================================================
// STOP
// ============================================================

let stopped =
    false;


// ============================================================
// MOD
// ============================================================

function mod(a, n) {

    const r =
        a % n;

    return r < 0n
        ? r + n
        : r;
}


// ============================================================
// GCD
// ============================================================

function gcd(a, b) {

    while (b !== 0n) {

        const t =
            a % b;

        a = b;
        b = t;
    }

    return a < 0n
        ? -a
        : a;
}


// ============================================================
// MOD POW
// ============================================================

function modPow(base, exp, modn) {

    let result =
        1n;

    base =
        mod(base, modn);

    while (exp > 0n) {

        if (exp & 1n) {

            result =
                (result * base) % modn;
        }

        base =
            (base * base) % modn;

        exp >>= 1n;
    }

    return result;
}


// ============================================================
// MOD INVERSE
// ============================================================

function modInverse(a, n) {

    let t =
        0n;

    let newT =
        1n;

    let r =
        n;

    let newR =
        mod(a, n);

    while (newR !== 0n) {

        const q =
            r / newR;

        [
            t,
            newT
        ] =
        [
            newT,
            t - q * newT
        ];

        [
            r,
            newR
        ] =
        [
            newR,
            r - q * newR
        ];
    }

    if (r !== 1n) {

        return null;
    }

    return mod(t, n);
}


// ============================================================
// RANDOM BIGINT
// ============================================================

function randomBigInt(max) {

    if (max <= 1n) {

        return 0n;
    }

    const bits =
        max.toString(2).length;

    const bytes =
        Math.ceil(bits / 8);

    while (true) {

        const arr =
            new Uint8Array(bytes);

        crypto.getRandomValues(
            arr
        );

        let x =
            0n;

        for (
            const b of arr
        ) {

            x =
                (x << 8n) |
                BigInt(b);
        }

        x =
            x % max;

        if (x > 0n) {

            return x;
        }
    }
}


// ============================================================
// SIEVE
// ============================================================

function sieve(limit) {

    const composite =
        new Uint8Array(
            limit + 1
        );

    const primes = [];

    for (
        let i = 2;
        i <= limit;
        i++
    ) {

        if (
            composite[i] === 0
        ) {

            primes.push(i);

            if (
                i * i <= limit
            ) {

                for (
                    let j = i * i;
                    j <= limit;
                    j += i
                ) {

                    composite[j] =
                        1;
                }
            }
        }
    }

    return primes;
}


const primes =
    sieve(1000000);


// ============================================================
// TRIAL DIVISION
// ============================================================

function trialDivision(N) {

    for (
        const p of primes
    ) {

        const bp =
            BigInt(p);

        if (
            bp * bp > N
        ) {

            break;
        }

        if (
            N % bp === 0n
        ) {

            return bp;
        }
    }

    return null;
}


// ============================================================
// MONTGOMERY DIFFERENTIAL ADDITION
// ============================================================

function montgomeryAdd(
    P,
    Q,
    diff,
    A24,
    N
) {

    const X1 =
        P[0];

    const Z1 =
        P[1];

    const X2 =
        Q[0];

    const Z2 =
        Q[1];

    const Xd =
        diff[0];

    const Zd =
        diff[1];


    const A =
        mod(
            X1 + Z1,
            N
        );

    const B =
        mod(
            X1 - Z1,
            N
        );

    const C =
        mod(
            X2 + Z2,
            N
        );

    const D =
        mod(
            X2 - Z2,
            N
        );

    const DA =
        mod(
            D * A,
            N
        );

    const CB =
        mod(
            C * B,
            N
        );

    const X =
        mod(
            Zd *
            mod(
                DA + CB,
                N
            ) *
            mod(
                DA + CB,
                N
            ),
            N
        );

    const Z =
        mod(
            Xd *
            mod(
                DA - CB,
                N
            ) *
            mod(
                DA - CB,
                N
            ),
            N
        );

    return [
        X,
        Z
    ];
}


// ============================================================
// MONTGOMERY DOUBLE
// ============================================================

function montgomeryDouble(
    P,
    A24,
    N
) {

    const X =
        P[0];

    const Z =
        P[1];

    const A =
        mod(
            X + Z,
            N
        );

    const AA =
        mod(
            A * A,
            N
        );

    const B =
        mod(
            X - Z,
            N
        );

    const BB =
        mod(
            B * B,
            N
        );

    const C =
        mod(
            AA - BB,
            N
        );

    const X2 =
        mod(
            AA * BB,
            N
        );

    const Z2 =
        mod(
            C *
            mod(
                BB +
                A24 * C,
                N
            ),
            N
        );

    return [
        X2,
        Z2
    ];
}


// ============================================================
// MONTGOMERY LADDER
// ============================================================

function montgomeryLadder(
    k,
    P,
    A24,
    N
) {

    let R0 =
        [
            1n,
            0n
        ];

    let R1 =
        P;

    let diff =
        P;

    const bits =
        k.toString(2);

    for (
        let i = 0;
        i < bits.length;
        i++
    ) {

        if (stopped) {

            return null;
        }

        const bit =
            bits[i];

        if (bit === "0") {

            R1 =
                montgomeryAdd(
                    R0,
                    R1,
                    diff,
                    A24,
                    N
                );

            R0 =
                montgomeryDouble(
                    R0,
                    A24,
                    N
                );

        } else {

            R0 =
                montgomeryAdd(
                    R0,
                    R1,
                    diff,
                    A24,
                    N
                );

            R1 =
                montgomeryDouble(
                    R1,
                    A24,
                    N
                );
        }
    }

    return R0;
}


// ============================================================
// ECM STAGE 1
// ============================================================

function ecmStage1(
    N,
    B1
) {

    if (
        N % 2n === 0n
    ) {

        return 2n;
    }

    const sigma =
        6n +
        randomBigInt(
            N - 6n
        );

    const u =
        mod(
            sigma * sigma - 5n,
            N
        );

    const v =
        mod(
            4n * sigma,
            N
        );

    const u3 =
        mod(
            u * u * u,
            N
        );

    const v3 =
        mod(
            v * v * v,
            N
        );

    const X =
        u3;

    const Z =
        v3;

    const numerator =
        mod(
            mod(
                v3 - u3,
                N
            ) *
            mod(
                v3 - u3,
                N
            ) *
            mod(
                3n * u3 + v3,
                N
            ),
            N
        );

    const denominator =
        mod(
            4n *
            u3 *
            v3,
            N
        );

    const inv =
        modInverse(
            denominator,
            N
        );

    if (
        inv === null
    ) {

        const g =
            gcd(
                denominator,
                N
            );

        if (
            g > 1n &&
            g < N
        ) {

            return g;
        }

        return null;
    }

    const A =
        mod(
            numerator *
            inv -
            2n,
            N
        );

    const A24 =
        mod(
            (A + 2n) *
            modInverse(
                4n,
                N
            ),
            N
        );


    let P =
        [
            X,
            Z
        ];


    for (
        const p of primes
    ) {

        if (
            p > B1
        ) {

            break;
        }

        let pp =
            p;

        while (
            pp * p <= B1
        ) {

            pp *= p;
        }

        P =
            montgomeryLadder(
                BigInt(pp),
                P,
                A24,
                N
            );

        if (
            P === null
        ) {

            return null;
        }

        const g =
            gcd(
                P[1],
                N
            );

        if (
            g > 1n &&
            g < N
        ) {

            return g;
        }

        if (
            g === N
        ) {

            return null;
        }
    }

    return null;
}


// ============================================================
// MILLER-RABIN
// ============================================================

function isPrime(N) {

    if (N < 2n) {

        return false;
    }

    const smallPrimes =
        [
            2n,
            3n,
            5n,
            7n,
            11n,
            13n,
            17n,
            19n,
            23n,
            29n,
            31n,
            37n
        ];

    for (
        const p of smallPrimes
    ) {

        if (
            N === p
        ) {

            return true;
        }

        if (
            N % p === 0n
        ) {

            return false;
        }
    }

    let d =
        N - 1n;

    let s =
        0;

    while (
        (d & 1n) === 0n
    ) {

        d >>= 1n;
        s++;
    }

    const bases =
        [
            2n,
            3n,
            5n,
            7n,
            11n,
            13n,
            17n,
            19n,
            23n,
            29n,
            31n,
            37n
        ];

    for (
        const a of bases
    ) {

        if (
            a >= N
        ) {

            continue;
        }

        let x =
            modPow(
                a,
                d,
                N
            );

        if (
            x === 1n ||
            x === N - 1n
        ) {

            continue;
        }

        let composite =
            true;

        for (
            let r = 1;
            r < s;
            r++
        ) {

            x =
                (x * x) % N;

            if (
                x === N - 1n
            ) {

                composite =
                    false;

                break;
            }
        }

        if (
            composite
        ) {

            return false;
        }
    }

    return true;
}


// ============================================================
// FACTORISATIE
// ============================================================

let factorList =
    [];


function factorRecursive(N) {

    if (stopped) {

        return;
    }

    if (
        N === 1n
    ) {

        return;
    }

    if (
        isPrime(N)
    ) {

        factorList.push(N);

        return;
    }

    const small =
        trialDivision(N);

    if (
        small !== null
    ) {

        logMsg(
            "Kleine factor gevonden: " +
            small
        );

        factorRecursive(
            small
        );

        factorRecursive(
            N / small
        );

        return;
    }


    const digits =
        N.toString().length;


    let settings;


    if (
        digits <= 25
    ) {

        settings =
            [
                [10000, 100],
                [25000, 100],
                [50000, 100]
            ];

    } else if (
        digits <= 35
    ) {

        settings =
            [
                [25000, 200],
                [50000, 200],
                [100000, 300]
            ];

    } else if (
        digits <= 45
    ) {

        settings =
            [
                [50000, 300],
                [100000, 500],
                [250000, 700]
            ];

    } else if (
        digits <= 55
    ) {

        settings =
            [
                [100000, 500],
                [250000, 700],
                [500000, 1000]
            ];

    } else {

        settings =
            [
                [250000, 700],
                [500000, 1000],
                [1000000, 1500]
            ];
    }


    for (
        const [
            B1,
            curves
        ] of settings
    ) {

        logMsg(
            "🔎 ECM op " +
            N
        );

        logMsg(
            "   B1 = " +
            B1 +
            " | curves = " +
            curves
        );


        for (
            let c = 1;
            c <= curves;
            c++
        ) {

            if (stopped) {

                return;
            }

            const f =
                ecmStage1(
                    N,
                    B1
                );

            if (
                f !== null &&
                f !== N
            ) {

                logMsg(
                    "🎯 ECM-factor gevonden: " +
                    f
                );

                factorRecursive(
                    f
                );

                factorRecursive(
                    N / f
                );

                return;
            }

            if (
                c % 10 === 0
            ) {

                logMsg(
                    "   curve " +
                    c +
                    "/" +
                    curves
                );
            }
        }
    }


    logMsg(
        "❌ ECM heeft geen factor gevonden."
    );

    factorList.push(N);
}


// ============================================================
// RESULTAAT
// ============================================================

function showResult() {

    if (
        stopped
    ) {

        return;
    }

    factorList.sort(
        (a, b) =>
            a < b
                ? -1
                : a > b
                    ? 1
                    : 0
    );

    logMsg("");
    logMsg(
        "=============================="
    );
    logMsg(
        "Factorisatie:"
    );

    for (
        const f of factorList
    ) {

        logMsg(
            f.toString()
        );
    }

    logMsg(
        "=============================="
    );
}


// ============================================================
// INPUT DIGITS
// ============================================================

function updateInputWidthAndDigits() {

    const value =
        Ninput.value;

    const digits =
        value.length;

    digitCount.textContent =
        "(" +
        digits +
        " digits)";

    Ninput.style.width =
        Math.max(
            12,
            digits + 1
        ) +
        "ch";
}


Ninput.addEventListener(
    "input",
    updateInputWidthAndDigits
);

updateInputWidthAndDigits();


// ============================================================
// START
// ============================================================

startBtn.onclick =
    async function () {

        const value =
            Ninput.value.trim();

        if (
            !/^\d+$/.test(value)
        ) {

            alert(
                "Voer een positief geheel getal in."
            );

            return;
        }

        const N =
            BigInt(value);

        if (
            N < 2n
        ) {

            alert(
                "N moet minstens 2 zijn."
            );

            return;
        }


        stopped =
            false;

        factorList =
            [];

        log.textContent =
            "";

        startBtn.disabled =
            true;

        stopBtn.disabled =
            false;

        clearBtn.disabled =
            true;


        logMsg(
            "🔍 Priemtest op N=" +
            N
        );


        if (
            isPrime(N)
        ) {

            logMsg(
                "ℹ️ N is priem."
            );

            factorList =
                [N];

            showResult();

            startBtn.disabled =
                false;

            stopBtn.disabled =
                true;

            clearBtn.disabled =
                false;

            return;
        }


        logMsg(
            "ℹ️ N is samengesteld."
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    10
                )
        );


        factorRecursive(
            N
        );


        if (
            !stopped
        ) {

            showResult();
        }


        startBtn.disabled =
            false;

        stopBtn.disabled =
            true;

        clearBtn.disabled =
            false;
    };


// ============================================================
// STOP
// ============================================================

stopBtn.onclick =
    function () {

        stopped =
            true;

        logMsg(
            "⛔ Gestopt."
        );

        startBtn.disabled =
            false;

        stopBtn.disabled =
            true;

        clearBtn.disabled =
            false;
    };


// ============================================================
// CLEAR
// ============================================================

clearBtn.onclick =
    function () {

        stopped =
            true;

        log.textContent =
            "";

        factorList =
            [];

        startBtn.disabled =
            false;

        stopBtn.disabled =
            true;

        clearBtn.disabled =
            false;
    };

</script>

</body>
</html>
