<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">

<title>ECM Factorisatie – Montgomery X/Z</title>

<style>
    body {
        font-family: monospace;
        background: #222;
        color: #ddd;
        padding: 20px;
    }

    h1 {
        color: #fff;
    }

    input {
        font-family: monospace;
        font-size: 16px;
        background: #111;
        color: #fff;
        border: 1px solid #555;
        padding: 4px;
    }

    button {
        font-family: monospace;
        font-size: 16px;
        padding: 5px 10px;
        margin-right: 5px;
        cursor: pointer;
    }

    .step-button {
        padding: 2px 8px;
        margin-left: 2px;
        margin-right: 0;
        font-size: 16px;
    }

    #log {
        margin-top: 15px;
        background: #111;
        padding: 10px;
        border: 1px solid #444;
        height: 500px;
        overflow-y: auto;
        white-space: pre-wrap;
    }
</style>
</head>

<body>

<h1>ECM Factorisatie – Montgomery X/Z</h1>

<p>
    Factoriseer N =
    <input
        type="text"
        id="N"
        value="11111111111"
        autocomplete="off"
        style="width:12ch;"
    />

    <button
        id="upBtn"
        class="step-button"
        type="button"
        title="Verhoog N met 1"
    >▲</button>

    <button
        id="downBtn"
        class="step-button"
        type="button"
        title="Verlaag N met 1"
    >▼</button>

    <span id="digitCount">(11 digits)</span>
</p>

<p>
    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>
    <button id="clearBtn">Clear</button>
</p>

<div id="log"></div>

<script>

const Ninput = document.getElementById("N");
const digitCount = document.getElementById("digitCount");

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const clearBtn = document.getElementById("clearBtn");

const upBtn = document.getElementById("upBtn");
const downBtn = document.getElementById("downBtn");

const log = document.getElementById("log");


// ============================================================
// ▲ / ▼ N + 1 / N - 1
// ============================================================

function changeInputValue(amount) {

    const value = Ninput.value.trim();

    if (!/^\d+$/.test(value)) return;

    let N = BigInt(value);

    N += amount;

    if (N < 0n)
        N = 0n;

    Ninput.value = N.toString();

    updateInputWidthAndDigits();

    Ninput.focus();
}

upBtn.onclick = () => {
    changeInputValue(1n);
};

downBtn.onclick = () => {
    changeInputValue(-1n);
};


// ============================================================
// Log
// ============================================================

function logMsg(text = "") {

    log.textContent += text + "\n";

    log.scrollTop = log.scrollHeight;
}


// ============================================================
// Browser gelegenheid geven om het scherm opnieuw te tekenen
// ============================================================

function yieldToBrowser() {

    return new Promise(resolve => setTimeout(resolve, 0));
}


// ============================================================
// Stop
// ============================================================

let stopped = false;


// ============================================================
// Modulo
// ============================================================

function mod(a, n) {

    const r = a % n;

    return r >= 0n ? r : r + n;
}


// ============================================================
// GCD
// ============================================================

function gcd(a, b) {

    while (b !== 0n) {

        const t = a % b;

        a = b;
        b = t;
    }

    return a < 0n ? -a : a;
}


// ============================================================
// Modular exponentiation
// ============================================================

function modPow(base, exp, modulus) {

    if (modulus === 1n)
        return 0n;

    let result = 1n;

    base = mod(base, modulus);

    while (exp > 0n) {

        if (exp & 1n)
            result = (result * base) % modulus;

        base = (base * base) % modulus;

        exp >>= 1n;
    }

    return result;
}


// ============================================================
// Modular inverse
// ============================================================

function modInverse(a, n) {

    let t = 0n;
    let newT = 1n;

    let r = n;
    let newR = mod(a, n);

    while (newR !== 0n) {

        const q = r / newR;

        [t, newT] = [
            newT,
            t - q * newT
        ];

        [r, newR] = [
            newR,
            r - q * newR
        ];
    }

    if (r !== 1n)
        return null;

    return mod(t, n);
}


// ============================================================
// Random BigInt
// ============================================================

function randomBigInt(min, max) {

    const range = max - min + 1n;

    const bits = range.toString(2).length;

    let value;

    do {

        value = 0n;

        let remaining = bits;

        while (remaining > 0) {

            const chunk = Math.min(30, remaining);

            const maxChunk = 1 << chunk;

            const randomChunk =
                Math.floor(Math.random() * maxChunk);

            value =
                (value << BigInt(chunk)) |
                BigInt(randomChunk);

            remaining -= chunk;
        }

    } while (value >= range);

    return min + value;
}


// ============================================================
// Sieve
// ============================================================

function sieve(limit) {

    const isPrime = new Uint8Array(limit + 1);

    isPrime.fill(1);

    isPrime[0] = 0;
    isPrime[1] = 0;

    for (let i = 2; i * i <= limit; i++) {

        if (isPrime[i]) {

            for (
                let j = i * i;
                j <= limit;
                j += i
            ) {
                isPrime[j] = 0;
            }
        }
    }

    const primes = [];

    for (let i = 2; i <= limit; i++) {

        if (isPrime[i])
            primes.push(i);
    }

    return primes;
}

const primes = sieve(1000000);


// ============================================================
// Trial division
// ============================================================

function trialDivision(N) {

    for (const p of primes) {

        const bp = BigInt(p);

        if (bp * bp > N)
            break;

        if (N % bp === 0n)
            return bp;
    }

    return null;
}


// ============================================================
// Montgomery addition
// ============================================================

function montgomeryAdd(P, Q, N, A24) {

    const X1 = P[0];
    const Z1 = P[1];

    const X2 = Q[0];
    const Z2 = Q[1];

    const add1 = mod(X1 * Z2, N);
    const add2 = mod(Z1 * X2, N);

    const add = mod(add1 + add2, N);
    const sub = mod(add1 - add2, N);

    const X3 = mod(sub * sub, N);

    const Z3 = mod(add * add, N);

    return [X3, Z3];
}


// ============================================================
// Montgomery doubling
// ============================================================

function montgomeryDouble(P, N, A24) {

    const X = P[0];
    const Z = P[1];

    const A = mod(X + Z, N);
    const AA = mod(A * A, N);

    const B = mod(X - Z, N);
    const BB = mod(B * B, N);

    const C = mod(AA - BB, N);

    const X2 = mod(AA * BB, N);

    const Z2 =
        mod(C * mod(BB + A24 * C, N), N);

    return [X2, Z2];
}


// ============================================================
// Montgomery ladder
// ============================================================

function montgomeryLadder(P, k, N, A24) {

    if (k === 0n)
        return [1n, 0n];

    let R0 = [1n, 0n];
    let R1 = P;

    const bits = k.toString(2);

    for (let i = 0; i < bits.length; i++) {

        if (stopped)
            return null;

        const bit = bits[i];

        if (bit === "0") {

            R1 = montgomeryAdd(R0, R1, N, A24);
            R0 = montgomeryDouble(R0, N, A24);

        } else {

            R0 = montgomeryAdd(R0, R1, N, A24);
            R1 = montgomeryDouble(R1, N, A24);
        }
    }

    return R0;
}


// ============================================================
// ECM Stage 1
// ============================================================

function ecmStage1(N, B1) {

    const sigma =
        randomBigInt(6n, N - 1n);

    const u =
        mod(sigma * sigma - 5n, N);

    const v =
        mod(4n * sigma, N);

    const u3 =
        mod(u * u * u, N);

    const v3 =
        mod(v * v * v, N);

    const numerator =
        mod((u3 - v3) * (3n * u + v), N);

    const denominator =
        mod(4n * u3 * v, N);

    const inv =
        modInverse(denominator, N);

    if (inv === null)
        return gcd(denominator, N);

    const A =
        mod(numerator * inv - 2n, N);

    const A24 =
        mod((A + 2n) * modInverse(4n, N), N);

    let P = [
        mod(u3, N),
        mod(v3, N)
    ];

    for (const p of primes) {

        if (p > B1)
            break;

        let pp = BigInt(p);

        while (pp * BigInt(p) <= BigInt(B1))
            pp *= BigInt(p);

        P =
            montgomeryLadder(
                P,
                pp,
                N,
                A24
            );

        if (P === null)
            return null;

        const g =
            gcd(P[1], N);

        if (g > 1n && g < N)
            return g;

        if (g === N)
            return g;
    }

    return gcd(P[1], N);
}


// ============================================================
// Miller-Rabin
// ============================================================

function isPrimeMR(n) {

    if (n < 2n)
        return false;

    const smallPrimes = [
        2n, 3n, 5n, 7n, 11n,
        13n, 17n, 19n, 23n,
        29n, 31n, 37n
    ];

    for (const p of smallPrimes) {

        if (n === p)
            return true;

        if (n % p === 0n)
            return false;
    }

    let d = n - 1n;
    let s = 0;

    while ((d & 1n) === 0n) {

        d >>= 1n;
        s++;
    }

    for (const a of smallPrimes) {

        if (a >= n)
            continue;

        let x =
            modPow(a, d, n);

        if (x === 1n || x === n - 1n)
            continue;

        let composite = true;

        for (let r = 1; r < s; r++) {

            x =
                modPow(x, 2n, n);

            if (x === n - 1n) {

                composite = false;
                break;
            }
        }

        if (composite)
            return false;
    }

    return true;
}


// ============================================================
// Factor list
// ============================================================

let factorList = [];


// ============================================================
// Recursive factorisation
// ============================================================

async function factorRecursive(N) {

    if (stopped)
        return;

    if (N === 1n)
        return;


    // --------------------------------------------------------
    // Priem?
    // --------------------------------------------------------

    if (isPrimeMR(N)) {

        factorList.push(N);

        logMsg(
            "   → priem: " +
            N.toString()
        );

        await yieldToBrowser();

        return;
    }


    // --------------------------------------------------------
    // Kleine factor
    // --------------------------------------------------------

    const smallFactor =
        trialDivision(N);

    if (
        smallFactor !== null &&
        smallFactor !== N
    ) {

        logMsg(
            "   Kleine factor gevonden: " +
            smallFactor.toString()
        );

        await yieldToBrowser();

        await factorRecursive(smallFactor);

        await factorRecursive(
            N / smallFactor
        );

        return;
    }


    // --------------------------------------------------------
    // ECM instellingen
    // --------------------------------------------------------

    const digits =
        N.toString().length;

    let settings;

    if (digits <= 25) {

        settings = [
            [10000, 100],
            [25000, 100],
            [50000, 100]
        ];

    } else if (digits <= 35) {

        settings = [
            [25000, 200],
            [50000, 200],
            [100000, 300]
        ];

    } else if (digits <= 45) {

        settings = [
            [50000, 300],
            [100000, 500],
            [250000, 700]
        ];

    } else if (digits <= 55) {

        settings = [
            [100000, 500],
            [250000, 700],
            [500000, 1000]
        ];

    } else {

        settings = [
            [250000, 700],
            [500000, 1000],
            [1000000, 1500]
        ];
    }


    // --------------------------------------------------------
    // ECM
    // --------------------------------------------------------

    for (const [B1, curves] of settings) {

        if (stopped)
            return;

        logMsg(
            "🚀 ECM Stage 1: B1 = " +
            B1 +
            ", curves = " +
            curves
        );

        await yieldToBrowser();


        for (let c = 1; c <= curves; c++) {

            if (stopped)
                return;


            const f =
                ecmStage1(N, B1);


            if (f !== null && f !== N && f > 1n) {

                logMsg(
                    "🎯 ECM-factor gevonden: " +
                    f.toString()
                );

                await yieldToBrowser();


                const other =
                    N / f;

                logMsg(
                    "🔎 C = " +
                    other.toString() +
                    " → verder factoriseren..."
                );

                await yieldToBrowser();


                // ------------------------------------------------
                // Hier wordt de gevonden factor én de overblijvende
                // C opnieuw afzonderlijk gefactoriseerd.
                // ------------------------------------------------

                await factorRecursive(f);

                await factorRecursive(other);

                return;
            }


            if (c % 10 === 0) {

                logMsg(
                    "   Curve " +
                    c +
                    "/" +
                    curves +
                    " voltooid."
                );
            }


            // ----------------------------------------------------
            // BELANGRIJK:
            // browser krijgt hier de gelegenheid om het logscherm
            // daadwerkelijk te tekenen.
            // ----------------------------------------------------

            await yieldToBrowser();
        }
    }


    // --------------------------------------------------------
    // Geen factor gevonden
    // --------------------------------------------------------

    logMsg(
        "❌ ECM heeft geen factor gevonden."
    );

    factorList.push(N);

    await yieldToBrowser();
}


// ============================================================
// Resultaat
// ============================================================

function showResult() {

    factorList.sort(
        (a, b) =>
            a < b ? -1 :
            a > b ? 1 : 0
    );

    logMsg("");
    logMsg("================================");
    logMsg("Factorisatie:");

    for (const f of factorList) {

        logMsg(
            "P" +
            f.toString().length +
            " = " +
            f.toString()
        );
    }

    logMsg("================================");
}


// ============================================================
// Input breedte + aantal cijfers
// ============================================================

function updateInputWidthAndDigits() {

    const value =
        Ninput.value.trim();

    const digits =
        value.length;

    digitCount.textContent =
        "(" + digits + " digits)";

    Ninput.style.width =
        Math.max(12, digits + 1) + "ch";
}

Ninput.addEventListener(
    "input",
    updateInputWidthAndDigits
);

updateInputWidthAndDigits();


// ============================================================
// Start
// ============================================================

startBtn.onclick = async function () {

    stopped = false;

    factorList = [];

    log.textContent = "";

    const value =
        Ninput.value.trim();

    if (!/^\d+$/.test(value)) {

        logMsg(
            "❌ Ongeldig getal."
        );

        return;
    }

    const N =
        BigInt(value);

    if (N < 2n) {

        logMsg(
            "❌ N moet groter zijn dan 1."
        );

        return;
    }


    logMsg(
        "🔍 Priemtest op N = " +
        N.toString()
    );

    if (isPrimeMR(N)) {

        logMsg(
            "ℹ️ N is priem."
        );

        factorList.push(N);

        showResult();

        return;
    }

    logMsg(
        "ℹ️ N is samengesteld."
    );


    // --------------------------------------------------------
    // Geef browser eerst kans om bovenstaande tekst te tonen
    // --------------------------------------------------------

    await yieldToBrowser();


    await factorRecursive(N);


    if (!stopped) {

        showResult();
    }
};


// ============================================================
// Stop
// ============================================================

stopBtn.onclick = function () {

    stopped = true;

    logMsg(
        "⛔ Gestopt."
    );
};


// ============================================================
// Clear
// ============================================================

clearBtn.onclick = function () {

    stopped = true;

    log.textContent = "";

    factorList = [];
};


</script>

</body>
</html>
