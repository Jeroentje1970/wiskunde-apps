<script>

// ============================================================
// BASIS
// ============================================================

function gcd(a, b) {

    if (a < 0n) a = -a;
    if (b < 0n) b = -b;

    while (b !== 0n) {

        const t = a % b;

        a = b;
        b = t;
    }

    return a;
}


function mod(a, n) {

    a %= n;

    if (a < 0n) {
        a += n;
    }

    return a;
}


// ============================================================
// MODULAIRE INVERSE
// ============================================================

function modInverse(a, n) {

    a = mod(a, n);

    let oldR = a;
    let r = n;

    let oldS = 1n;
    let s = 0n;

    while (r !== 0n) {

        const q = oldR / r;

        [oldR, r] =
            [r, oldR - q * r];

        [oldS, s] =
            [s, oldS - q * s];
    }

    return [
        oldR,
        mod(oldS, n)
    ];
}


// ============================================================
// MODULAIRE MACHT
// ============================================================

function modPow(base, exp, n) {

    base = mod(base, n);

    let result = 1n;

    while (exp > 0n) {

        if ((exp & 1n) !== 0n) {

            result =
                (result * base) % n;
        }

        base =
            (base * base) % n;

        exp >>= 1n;
    }

    return result;
}


// ============================================================
// RANDOM BIGINT
// ============================================================

function randomBigIntBelow(max) {

    if (max <= 1n) {
        return 0n;
    }

    const bits =
        max.toString(2).length;

    const words =
        Math.ceil(bits / 32);

    const buffer =
        new Uint32Array(words);

    while (true) {

        crypto.getRandomValues(buffer);

        let value = 0n;

        for (let i = 0; i < words; i++) {

            value =
                (value << 32n) |
                BigInt(buffer[i]);
        }

        const extraBits =
            words * 32 - bits;

        if (extraBits > 0) {

            value &=
                (1n << BigInt(bits)) - 1n;
        }

        if (
            value > 0n &&
            value < max
        ) {

            return value;
        }
    }
}


// ============================================================
// PRIEMGETALLEN
// ============================================================

function generatePrimes(limit) {

    const sieve =
        new Uint8Array(limit + 1);

    sieve.fill(1);

    sieve[0] = 0;
    sieve[1] = 0;

    for (
        let p = 2;
        p * p <= limit;
        p++
    ) {

        if (sieve[p]) {

            for (
                let j = p * p;
                j <= limit;
                j += p
            ) {

                sieve[j] = 0;
            }
        }
    }

    const primes = [];

    for (
        let p = 2;
        p <= limit;
        p++
    ) {

        if (sieve[p]) {

            primes.push(BigInt(p));
        }
    }

    return primes;
}


// ============================================================
// TRIAL DIVISION PRIMES
//
// Tot 1.000.000.
// Hierdoor worden ook kleine cofactors die na ECM ontstaan
// zeer snel afgehandeld.
//
// Bijvoorbeeld:
//
// 2535913 = 719 × 3527
//
// wordt direct gevonden.
// ============================================================

const trialPrimes =
    generatePrimes(1000000);


// ============================================================
// ECM-SCALAR
//
// K = product van alle grootste machten p^e <= B1
// ============================================================

function computeECMScalar(primes, B1) {

    const B =
        BigInt(B1);

    let K = 1n;

    for (const p of primes) {

        let q = p;

        while (q * p <= B) {

            q *= p;
        }

        K *= q;
    }

    return K;
}


// ============================================================
// MONTGOMERY DOUBLE
//
// Curve:
//
// y² = x³ + A*x² + x
//
// A24 = (A + 2)/4
// ============================================================

function montgomeryDouble(P, A24, N) {

    const X = P[0];
    const Z = P[1];

    const A =
        mod(X + Z, N);

    const AA =
        (A * A) % N;

    const B =
        mod(X - Z, N);

    const BB =
        (B * B) % N;

    const C =
        mod(AA - BB, N);

    const X2 =
        (AA * BB) % N;

    const Z2 =
        (
            C *
            mod(
                BB + A24 * C,
                N
            )
        ) % N;

    return [X2, Z2];
}


// ============================================================
// MONTGOMERY DIFFERENTIËLE OPTELLING
// ============================================================

function montgomeryAdd(P, Q, D, N) {

    const X1 = P[0];
    const Z1 = P[1];

    const X2 = Q[0];
    const Z2 = Q[1];

    const Xd = D[0];
    const Zd = D[1];

    const A =
        mod(X1 + Z1, N);

    const B =
        mod(X1 - Z1, N);

    const C =
        mod(X2 + Z2, N);

    const Dd =
        mod(X2 - Z2, N);

    const DA =
        (Dd * A) % N;

    const CB =
        (C * B) % N;

    const S1 =
        mod(DA + CB, N);

    const S2 =
        mod(DA - CB, N);

    const X3 =
        (Zd * S1 * S1) % N;

    const Z3 =
        (Xd * S2 * S2) % N;

    return [X3, Z3];
}


// ============================================================
// MONTGOMERY LADDER
// ============================================================

function montgomeryLadder(k, P, A24, N) {

    if (k === 0n) {

        return [0n, 0n];
    }

    const bits =
        k.toString(2);

    let R0 = P;

    let R1 =
        montgomeryDouble(
            P,
            A24,
            N
        );

    for (
        let i = 1;
        i < bits.length;
        i++
    ) {

        if (bits[i] === "0") {

            R1 =
                montgomeryAdd(
                    R0,
                    R1,
                    P,
                    N
                );

            R0 =
                montgomeryDouble(
                    R0,
                    A24,
                    N
                );

        } else {

            R0 =
                montgomeryAdd(
                    R0,
                    R1,
                    P,
                    N
                );

            R1 =
                montgomeryDouble(
                    R1,
                    A24,
                    N
                );
        }
    }

    return R0;
}


// ============================================================
// SUYAMA ECM CURVE
// ============================================================

function createECMCurve(N) {

    while (true) {

        const sigma =
            randomBigIntBelow(
                N - 6n
            ) + 6n;

        const u =
            mod(
                sigma * sigma - 5n,
                N
            );

        const v =
            mod(
                4n * sigma,
                N
            );

        if (
            u === 0n ||
            v === 0n
        ) {

            continue;
        }

        const u2 =
            (u * u) % N;

        const u3 =
            (u2 * u) % N;

        const vu =
            mod(
                v - u,
                N
            );

        const vu2 =
            (vu * vu) % N;

        const vu3 =
            (vu2 * vu) % N;

        const threeUPlusV =
            mod(
                3n * u + v,
                N
            );

        const numerator =
            (
                vu3 *
                threeUPlusV
            ) % N;

        const denominator =
            (
                (
                    16n *
                    u3
                ) % N *
                v
            ) % N;

        const g =
            gcd(
                denominator,
                N
            );

        if (
            g !== 1n &&
            g !== N
        ) {

            return {
                factor: g
            };
        }

        const inverseResult =
            modInverse(
                denominator,
                N
            );

        const gg =
            inverseResult[0];

        const inverse =
            inverseResult[1];

        if (gg !== 1n) {

            if (gg !== N) {

                return {
                    factor: gg
                };
            }

            continue;
        }

        const A24 =
            (
                numerator *
                inverse
            ) % N;

        return {

            P: [
                u3,
                (v * v * v) % N
            ],

            A24: A24
        };
    }
}


// ============================================================
// MILLER-RABIN
// ============================================================

function isProbablePrime(
    N,
    rounds = 12
) {

    if (N < 2n) {

        return false;
    }

    const smallPrimes = [
        2n, 3n, 5n, 7n,
        11n, 13n, 17n,
        19n, 23n, 29n,
        31n, 37n
    ];

    for (const p of smallPrimes) {

        if (N === p) {

            return true;
        }

        if (N % p === 0n) {

            return false;
        }
    }

    let d = N - 1n;
    let s = 0;

    while (
        (d & 1n) === 0n
    ) {

        d >>= 1n;
        s++;
    }

    for (
        let i = 0;
        i < rounds;
        i++
    ) {

        const a =
            randomBigIntBelow(
                N - 3n
            ) + 2n;

        let x =
            modPow(
                a,
                d,
                N
            );

        if (
            x === 1n ||
            x === N - 1n
        ) {

            continue;
        }

        let witnessPassed = false;

        for (
            let r = 1;
            r < s;
            r++
        ) {

            x =
                (x * x) % N;

            if (
                x === N - 1n
            ) {

                witnessPassed = true;

                break;
            }
        }

        if (!witnessPassed) {

            return false;
        }
    }

    return true;
}


// ============================================================
// FACTORLABEL
// ============================================================

function factorLabel(n) {

    const digits =
        n.toString().length;

    const prime =
        isProbablePrime(n);

    return {

        prime: prime,

        text:
            `${prime ? "P" : "C"}${digits} = ${n}`
    };
}


// ============================================================
// KLEINE FACTOREN
//
// Belangrijk:
//
// Deze functie is nu expliciet verantwoordelijk voor ALLE
// kleine factoren tot 1.000.000.
//
// Bovendien wordt alleen gezocht zolang p² <= N.
//
// Voor:
//
// 2535913
//
// wordt dus:
//
// 719 × 3527
//
// gevonden voordat ECM wordt aangeroepen.
// ============================================================

function removeSmallFactors(
    N,
    factors,
    log
) {

    for (const p of trialPrimes) {

        if (p * p > N) {

            break;
        }

        if (
            N % p === 0n
        ) {

            while (
                N % p === 0n
            ) {

                factors.push(p);

                log(
                    `   Kleine factor gevonden: ${p}`
                );

                N /= p;
            }
        }

        if (N === 1n) {

            break;
        }
    }

    return N;
}


// ============================================================
// DIRECTE KLEINE FACTORZOEKER
//
// Extra veiligheidsnet.
//
// Voor kleine getallen wordt expliciet trial division
// uitgevoerd, onafhankelijk van ECM.
//
// Dit voorkomt dat bijvoorbeeld een C7 alsnog onnodig
// naar ECM gaat.
//
// ============================================================

function directSmallFactor(N) {

    for (const p of trialPrimes) {

        if (p * p > N) {

            return null;
        }

        if (N % p === 0n) {

            return p;
        }
    }

    return null;
}


// ============================================================
// ECM STAGE 1 — ÉÉN CURVE
// ============================================================

function runECMCurve(
    N,
    K,
    onStop
) {

    if (onStop()) {

        return null;
    }

    const curve =
        createECMCurve(N);

    if (curve.factor) {

        return curve.factor;
    }

    if (onStop()) {

        return null;
    }

    const R =
        montgomeryLadder(
            K,
            curve.P,
            curve.A24,
            N
        );

    const g =
        gcd(
            R[1],
            N
        );

    if (
        g !== 1n &&
        g !== N
    ) {

        return g;
    }

    return null;
}


// ============================================================
// ECM-FASE
// ============================================================

async function ecmPhase(
    N,
    B1,
    curves,
    log,
    onStop
) {

    log("");

    log(
        `🔄 ECM Stage 1 — B1=${B1.toLocaleString()}`
    );

    const primes =
        generatePrimes(B1);

    log(
        `   ${primes.length.toLocaleString()} priemgetallen`
    );

    const K =
        computeECMScalar(
            primes,
            B1
        );

    log(
        `   K heeft ${K.toString(2).length.toLocaleString()} bits`
    );

    for (
        let curveNo = 1;
        curveNo <= curves;
        curveNo++
    ) {

        if (onStop()) {

            return null;
        }

        const start =
            performance.now();

        const factor =
            runECMCurve(
                N,
                K,
                onStop
            );

        const elapsed =
            performance.now() -
            start;

        if (factor) {

            return {

                factor: factor,

                curve: curveNo,

                elapsed: elapsed
            };
        }

        if (
            curveNo === 1 ||
            curveNo % 5 === 0
        ) {

            log(
                `   Curve ${curveNo}` +
                `   (${elapsed.toFixed(0)} ms)`
            );

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        0
                    )
            );
        }
    }

    return null;
}


// ============================================================
// ADAPTIVE ECM
// ============================================================

async function adaptiveECM(
    N,
    log,
    onStop
) {

    const settings = [

        {
            B1: 10000,
            curves: 40
        },

        {
            B1: 25000,
            curves: 40
        },

        {
            B1: 50000,
            curves: 50
        },

        {
            B1: 100000,
            curves: 50
        },

        {
            B1: 250000,
            curves: 60
        },

        {
            B1: 500000,
            curves: 70
        },

        {
            B1: 1000000,
            curves: 80
        }
    ];

    for (
        const setting of settings
    ) {

        if (onStop()) {

            return null;
        }

        const result =
            await ecmPhase(
                N,
                setting.B1,
                setting.curves,
                log,
                onStop
            );

        if (result) {

            return result;
        }
    }

    return null;
}


// ============================================================
// RECURSIEVE FACTORISATIE
// ============================================================

async function factorRecursive(
    N,
    factors,
    log,
    onStop,
    depth = 0
) {

    if (onStop()) {

        return false;
    }

    if (N === 1n) {

        return true;
    }

    const indent =
        "  ".repeat(depth);


    // --------------------------------------------------------
    // KLEINE FACTOREN
    // --------------------------------------------------------

    N =
        removeSmallFactors(
            N,
            factors,
            message =>
                log(
                    indent + message
                )
        );

    if (N === 1n) {

        return true;
    }


    // --------------------------------------------------------
    // PRIEMTEST
    // --------------------------------------------------------

    const info =
        factorLabel(N);

    log(
        `${indent}🔍 Controle: ${info.text}`
    );

    if (info.prime) {

        factors.push(N);

        log(
            `${indent}   → priemfactor toegevoegd`
        );

        return true;
    }


    // --------------------------------------------------------
    // EXTRA VEILIGHEIDSNET VOOR KLEINE COFACTORS
    //
    // Als N <= 1.000.000.000.000, dan is directe trial
    // division praktisch gratis vergeleken met ECM.
    //
    // Dit voorkomt dat kleine samengestelde getallen ooit
    // onnodig ECM in gaan.
    // --------------------------------------------------------

    if (N <= 1000000000000n) {

        const smallFactor =
            directSmallFactor(N);

        if (smallFactor) {

            const other =
                N / smallFactor;

            log(
                `${indent}   Kleine factor gevonden: ${smallFactor}`
            );

            log(
                `${indent}   Cofactor: ${other}`
            );

            const ok1 =
                await factorRecursive(
                    smallFactor,
                    factors,
                    log,
                    onStop,
                    depth + 1
                );

            if (!ok1) {

                return false;
            }

            return await factorRecursive(
                other,
                factors,
                log,
                onStop,
                depth + 1
            );
        }
    }


    // --------------------------------------------------------
    // N IS SAMENGESTELD
    // --------------------------------------------------------

    log(
        `${indent}   → samengesteld, ECM nodig`
    );

    log("");

    log(
        `${indent}🔎 ECM op ${N}`
    );

    const result =
        await adaptiveECM(
            N,
            message =>
                log(
                    indent + message
                ),
            onStop
        );

    if (!result) {

        log(
            `${indent}❌ ECM heeft geen factor gevonden.`
        );

        return false;
    }

    const factor =
        result.factor;


    // --------------------------------------------------------
    // VEILIGHEIDSCONTROLES
    // --------------------------------------------------------

    if (
        factor <= 1n ||
        factor >= N ||
        N % factor !== 0n
    ) {

        log(
            `${indent}❌ ECM gaf een ongeldige factor.`
        );

        return false;
    }

    const cofactor =
        N / factor;


    // --------------------------------------------------------
    // CLASSIFICEREN
    // --------------------------------------------------------

    const factorInfo =
        factorLabel(factor);

    const cofactorInfo =
        factorLabel(cofactor);

    log("");

    log(
        `${indent}✅ FACTOR GEVONDEN`
    );

    log(
        `${indent}   ${factorInfo.text}`
    );

    log(
        `${indent}   Cofactor: ${cofactorInfo.text}`
    );

    log(
        `${indent}   Curve = ${result.curve}`
    );

    log(
        `${indent}   Curve-tijd = ` +
        `${result.elapsed.toFixed(0)} ms`
    );


    // --------------------------------------------------------
    // FACTOR VERDER ONTBINDEN
    // --------------------------------------------------------

    log("");

    log(
        `${indent}↳ Factor verder ontbinden:`
    );

    const ok1 =
        await factorRecursive(
            factor,
            factors,
            log,
            onStop,
            depth + 1
        );

    if (!ok1) {

        return false;
    }


    // --------------------------------------------------------
    // COFACTOR VERDER ONTBINDEN
    // --------------------------------------------------------

    log("");

    log(
        `${indent}↳ Cofactor verder ontbinden:`
    );

    const ok2 =
        await factorRecursive(
            cofactor,
            factors,
            log,
            onStop,
            depth + 1
        );

    return ok2;
}


// ============================================================
// SORTEREN
// ============================================================

function sortFactors(factors) {

    factors.sort(
        (a, b) => {

            if (a < b) return -1;

            if (a > b) return 1;

            return 0;
        }
    );
}


// ============================================================
// UI
// ============================================================

const logEl =
    document.getElementById(
        "log"
    );

const startBtn =
    document.getElementById(
        "startBtn"
    );

const stopBtn =
    document.getElementById(
        "stopBtn"
    );

const clearBtn =
    document.getElementById(
        "clearBtn"
    );

const Ninput =
    document.getElementById(
        "N"
    );

const digitCount =
    document.getElementById(
        "digitCount"
    );

let stopFlag = false;


// ============================================================
// LOG
// ============================================================

function logMsg(message) {

    logEl.textContent +=
        message + "\n";

    logEl.scrollTop =
        logEl.scrollHeight;
}


// ============================================================
// INPUT
// ============================================================

function updateInputWidthAndDigits() {

    const value =
        Ninput.value.trim();

    const digits =
        value.replace(
            /\D/g,
            ""
        ).length;

    Ninput.style.width =
        Math.max(
            digits,
            10
        ) + "ch";

    digitCount.textContent =
        `(${digits} digits)`;
}

updateInputWidthAndDigits();

Ninput.addEventListener(
    "input",
    updateInputWidthAndDigits
);


// ============================================================
// START
// ============================================================

startBtn.onclick = async () => {

    logEl.textContent = "";

    stopFlag = false;

    const Nstr =
        Ninput.value.trim();

    if (
        !/^\d+$/.test(Nstr)
    ) {

        alert(
            "Voer een geldig natuurlijk getal in."
        );

        return;
    }

    const N =
        BigInt(Nstr);

    if (N < 2n) {

        alert(
            "Het getal moet groter zijn dan 1."
        );

        return;
    }

    startBtn.disabled = true;
    stopBtn.disabled = false;
    clearBtn.disabled = true;

    const totalStart =
        performance.now();

    logMsg(
        `🔍 Priemtest op N=${N}`
    );


    // --------------------------------------------------------
    // DIRECTE PRIEMTEST
    // --------------------------------------------------------

    if (
        isProbablePrime(N)
    ) {

        logMsg("");

        logMsg(
            `✅ P${N.toString().length} = ${N}`
        );

        logMsg(
            "   N is waarschijnlijk priem."
        );

        startBtn.disabled = false;
        stopBtn.disabled = true;
        clearBtn.disabled = false;

        return;
    }


    logMsg("");

    logMsg(
        "ℹ️ N is samengesteld."
    );

    logMsg("");

    logMsg(
        "🚀 Montgomery ECM gestart..."
    );

    const factors = [];

    let success = false;

    try {

        success =
            await factorRecursive(
                N,
                factors,
                logMsg,
                () => stopFlag
            );

    } catch (error) {

        logMsg("");

        logMsg(
            `❌ JavaScript-fout: ${error.message}`
        );

        console.error(error);
    }


    // --------------------------------------------------------
    // EINDRESULTAAT
    // --------------------------------------------------------

    if (
        success &&
        !stopFlag
    ) {

        sortFactors(factors);

        logMsg("");

        logMsg(
            "========================================"
        );

        logMsg(
            "VOLLEDIGE FACTORISATIE"
        );

        logMsg(
            "========================================"
        );

        for (
            const factor of factors
        ) {

            const info =
                factorLabel(factor);

            logMsg(
                `  ${info.text}`
            );
        }


        // ----------------------------------------------------
        // PRODUCTCONTROLE
        // ----------------------------------------------------

        let product = 1n;

        for (
            const factor of factors
        ) {

            product *= factor;
        }

        logMsg("");

        logMsg(
            "Controle:"
        );

        logMsg(
            `  Product = ${product}`
        );

        logMsg(
            `  N       = ${N}`
        );

        if (
            product === N
        ) {

            logMsg(
                "  ✅ Product = N"
            );

            logMsg("");

            logMsg(
                `Totale tijd = ` +
                `${(
                    (performance.now() -
                    totalStart) / 1000
                ).toFixed(2)} s`
            );

        } else {

            logMsg(
                "  ❌ FOUT: product ≠ N"
            );
        }

    } else if (stopFlag) {

        logMsg("");

        logMsg(
            "⏹️ Factorisatie gestopt."
        );

    } else {

        logMsg("");

        logMsg(
            "❌ Geen volledige factorisatie gevonden."
        );

        logMsg(
            "De ECM-fasen zijn uitgeput."
        );
    }

    startBtn.disabled = false;
    stopBtn.disabled = true;
    clearBtn.disabled = false;
};


// ============================================================
// STOP
// ============================================================

stopBtn.onclick = () => {

    stopFlag = true;

    logMsg("");

    logMsg(
        "⏹️ Stop gevraagd..."
    );

    stopBtn.disabled = true;
};


// ============================================================
// WISSEN
// ============================================================

clearBtn.onclick = () => {

    Ninput.value = "";

    updateInputWidthAndDigits();

    logEl.textContent = "";
};

</script>

</body>
</html>
